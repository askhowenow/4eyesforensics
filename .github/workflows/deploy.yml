name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::235494780327:role/4eyes-production-github-deploy
  ARTIFACT_BUCKET: 4eyes-forensics-artifacts-235494780327
  EC2_INSTANCE_ID: i-07857eeef3332b87d

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload immutable release bundle
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET || env.ARTIFACT_BUCKET }}
        run: |
          tar --exclude=.git --exclude=.venv --exclude=.terraform --exclude=staticfiles --exclude='*.sqlite3' --exclude='*.tfplan' -czf release.tgz .
          aws s3 cp release.tgz "s3://${ARTIFACT_BUCKET}/releases/${GITHUB_SHA}.tgz"
      - name: Deploy through SSM
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET || env.ARTIFACT_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || env.EC2_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="sudo /usr/local/bin/4eyes-deploy $ARTIFACT_BUCKET $GITHUB_SHA" \
            --query Command.CommandId --output text)
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM deployment timed out" >&2
          exit 1
